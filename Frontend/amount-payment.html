```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enter Payment Details</title>
    <link rel="stylesheet" href="styles.css">
    <script src="payment.js" defer></script>
</head>
<body class="login-body">
    <div class="payment-form">
        <h2>Confirm Payment</h2>

        <p id="paymentReceiver"></p>

        <label for="amount">Amount (₹)</label>
        <input type="number" id="amount" min="0.01" step="0.01"
               placeholder="Enter amount">

        <label for="paymentPassword">Password</label>
        <input type="password" id="paymentPassword"
               placeholder="Enter password">

        <p id="amountMessage" class="errorMessage"></p>

        <button type="button" id="confirmPayment">Confirm Payment</button>
        <button type="button" onclick="location.href='homepage.html'">Cancel</button>
    </div>
</body>
</html>
```
