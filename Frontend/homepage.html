<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure UPI Payment Simulator</title>

    <link rel="stylesheet" href="styles.css">
    <style>
        .logout-link {
            display: inline-block;
            margin-top: 5px;
            color: #d71920;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .logout-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1 style="text-align: center;">
        Secure UPI Payment Simulator
    </h1>

    <div style="text-align: center;">
        <p id="welcome" style="margin-bottom: 2px;"></p>
        <span onclick="logout()" class="logout-link">Logout</span>
    </div>

    <!-- Payment options -->
    <div id="homepage-body">

        <a href="scan-payment.html" class="payment">
            <img src="scan.png" alt="Scan QR Code">
            <p>Pay with Scan</p>
        </a>

        <a href="account-payment.html" class="payment">
            <img src="debit-card.png" alt="Account Number">
            <p>Pay with Account Number</p>
        </a>

        <a href="phone-payment.html" class="payment">
            <img src="phone.jpg" alt="Phone Number">
            <p>Pay with Phone Number</p>
        </a>

    </div>

    <!-- Balance and transaction options -->
    <div id="check">

        <a href="balance.html" class="check-btn">
            <p class="check-text">Check Balance</p>
        </a>

        <a href="history.html" class="check-btn">
            <p class="check-text">Transaction History</p>
        </a>

    </div>

    <!-- Check login session -->
    <script>
        const username = sessionStorage.getItem("loggedInUsername");

        if (!username) {
            window.location.href = "login.html";
        } else {
            const acc = sessionStorage.getItem("loggedInAccount");
            document.getElementById("welcome").innerHTML =
                "Welcome, <strong>" + username + "</strong>" +
                (acc ? " (Acc: " + acc + ")" : "");
        }

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
