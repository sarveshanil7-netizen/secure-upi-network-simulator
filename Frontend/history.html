
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .history-table-container {
            width: 100%;
            overflow-x: auto;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .history-table th,
        .history-table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }

        .history-table th {
            background-color: #f2f2f2;
        }

        .history-table td {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="payment-form">

        <h2>Transaction History</h2>

        <p id="historyMessage">Loading transactions...</p>

        <div class="history-table-container">
            <table class="history-table" id="historyTable" hidden>
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Sender Account</th>
                        <th>Receiver Account</th>
                        <th>Amount (₹)</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="transactionList"></tbody>
            </table>
        </div>

        <p>
            <a href="homepage.html">Back to Home</a>
        </p>

    </div>

    <script>
        async function loadTransactionHistory() {
            const message = document.getElementById("historyMessage");
            const table = document.getElementById("historyTable");
            const list = document.getElementById("transactionList");

            const username = sessionStorage.getItem("loggedInUsername");

            if (!username) {
                window.location.href = "login.html";
                return;
            }

            const accounts = {
                "Sarvesh1": "111100000001",
                "Srimano2": "111100000002",
                "Kasi3": "111100000003",
                "Hasiba4": "111100000004"
            };

            const userAccount = accounts[username];

            if (!userAccount) {
                message.textContent =
                    "Unknown user. Please log in again.";
                table.hidden = true;
                return;
            }

            try {
                const response = await fetch(
                    "http://localhost:8080/api/history"
                );

                if (!response.ok) {
                    throw new Error("Failed to load history");
                }

                const transactions = await response.json();

                list.replaceChildren();

                // Filter transactions for the logged-in user.
                const userTransactions = transactions.filter(record => {
                    const parts = record.split("|").map(
                        part => part.trim()
                    );

                    const sender = (parts[1] || "")
                        .replace("From:", "").trim();

                    const receiver = (parts[2] || "")
                        .replace("To:", "").trim();

                    return sender === userAccount ||
                           receiver === userAccount;
                });

                if (userTransactions.length === 0) {
                    message.textContent =
                        "No transactions found for your account.";
                    table.hidden = true;
                    return;
                }

                // Show the newest transactions first.
                userTransactions.slice().reverse().forEach(record => {
                    const parts = record.split("|").map(
                        part => part.trim()
                    );

                    const transactionId = parts[0] || "-";

                    const sender = (parts[1] || "")
                        .replace("From:", "").trim();

                    const receiver = (parts[2] || "")
                        .replace("To:", "").trim();

                    const amount = (parts[3] || "")
                        .replace("Amount:", "")
                        .replace("Rs.", "").trim();

                    const status = parts[4] || "-";

                    const row = document.createElement("tr");

                    [
                        transactionId,
                        sender,
                        receiver,
                        "₹" + amount,
                        status
                    ].forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    list.appendChild(row);
                });

                message.textContent = "";
                table.hidden = false;

            } catch (error) {
                console.error("Transaction history error:", error);

                table.hidden = true;
                message.textContent =
                    "Unable to load history. Please check that the Java server is running.";
            }
        }

        document.addEventListener(
            "DOMContentLoaded",
            loadTransactionHistory
        );
    </script>

</body>
</html>
