<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Transaction History</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        .history-table-container {
            width: 100%;
            overflow-x: auto;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .history-table th,
        .history-table td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
            white-space: nowrap;
        }

        .history-table th {
            background-color: #173b67;
            color: white;
        }

        .history-table td {
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="payment-form" style="width: 750px; max-width: 95%;">

        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <h2 style="margin: 0;">My Transactions</h2>
            <a href="global-history.html" style="background: #176b50; color: white; padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: bold;">
                View Global SQL Ledger &rarr;
            </a>
        </div>

        <p id="historyMessage">Loading transactions...</p>

        <div class="history-table-container">
            <table class="history-table" id="historyTable" hidden>
                <thead>
                    <tr>
                        <th>Transaction ID</th>
                        <th>Sender Account</th>
                        <th>Receiver Account</th>
                        <th>Amount (₹)</th>
                        <th>Status</th>
                    </tr>
                </thead>

                <tbody id="transactionList"></tbody>
            </table>
        </div>

        <p style="text-align: center; margin-top: 25px;">
            <a href="homepage.html">&larr; Back to Home</a>
        </p>

    </div>

    <script>
        async function loadTransactionHistory() {
            const message = document.getElementById("historyMessage");
            const table = document.getElementById("historyTable");
            const list = document.getElementById("transactionList");

            const username = sessionStorage.getItem("loggedInUsername");
            let userAccount = sessionStorage.getItem("loggedInAccount");

            if (!username) {
                window.location.href = "login.html";
                return;
            }

            const fallbackAccounts = {
                "Sarvesh1": "111100000001",
                "Srimano2": "111100000002",
                "Kasi3": "111100000003",
                "Hasiba4": "111100000004"
            };

            if (!userAccount) {
                userAccount = fallbackAccounts[username];
            }

            if (!userAccount) {
                message.textContent = "Unknown user account. Please log in again.";
                table.hidden = true;
                return;
            }

            try {
                // Try fetching from the global SQL history endpoint first
                let transactions = [];
                const resGlobal = await fetch("http://localhost:8080/api/global-history");

                if (resGlobal.ok) {
                    const data = await resGlobal.json();
                    transactions = data.map(item => 
                        `${item.transactionId} | From: ${item.sender} | To: ${item.receiver} | Amount: Rs.${item.amount} | ${item.status}`
                    );
                } else {
                    const response = await fetch("http://localhost:8080/api/history");
                    if (response.ok) transactions = await response.json();
                }

                list.replaceChildren();

                // Filter transactions for the logged-in user
                const userTransactions = transactions.filter(record => {
                    const parts = record.split("|").map(part => part.trim());
                    const sender = (parts[1] || "").replace("From:", "").trim();
                    const receiver = (parts[2] || "").replace("To:", "").trim();
                    return sender === userAccount || receiver === userAccount;
                });

                if (userTransactions.length === 0) {
                    message.textContent = "No transactions found for your account (" + userAccount + ").";
                    table.hidden = true;
                    return;
                }

                userTransactions.forEach(record => {
                    const parts = record.split("|").map(part => part.trim());
                    const transactionId = parts[0] || "-";
                    const sender = (parts[1] || "").replace("From:", "").trim();
                    const receiver = (parts[2] || "").replace("To:", "").trim();
                    const amount = (parts[3] || "").replace("Amount:", "").replace("Rs.", "").trim();
                    const status = parts[4] || "-";

                    const row = document.createElement("tr");
                    [transactionId, sender, receiver, "₹" + amount, status].forEach(value => {
                        const cell = document.createElement("td");
                        cell.textContent = value;
                        row.appendChild(cell);
                    });

                    list.appendChild(row);
                });

                message.textContent = "";
                table.hidden = false;

            } catch (error) {
                console.error("Transaction history error:", error);
                table.hidden = true;
                message.textContent = "Unable to load history. Please check that the Java server is running.";
            }
        }

        document.addEventListener("DOMContentLoaded", loadTransactionHistory);
    </script>

</body>
</html>
