<!DOCTYPE html>
<html>
<head>
    <title>Pay by Account Number</title>
    <link rel="stylesheet" href="styles.css">
    <script src="payment.js" defer></script>
</head>
<body>
    <div class="payment-form">
        <h2>Pay with Account Number</h2>

        <label for="receiverAccount">Receiver's Account Number:</label>
        <input type="text" id="receiverAccount"
               maxlength="12"
               placeholder="Enter 12-digit account number"
               required>

        <label for="amount">Amount (₹):</label>
        <input type="number" id="amount"
               min="0.01" step="0.01"
               placeholder="Enter amount"
               required>

        <label for="paymentPassword">Password:</label>
        <input type="password" id="paymentPassword"
               placeholder="Enter your password"
               required>

        <p id="accountMessage" class="errorMessage"></p>

        <button type="button" id="payByAccount">Pay</button>

        <p><a href="homepage.html">Back to Home</a></p>
    </div>
</body>
</html>
