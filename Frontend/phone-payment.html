
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay with Phone Number</title>
    <link rel="stylesheet" href="styles.css">
    <script src="payment.js" defer></script>
</head>
<body class="login-body">
    <div class="payment-form">
        <h2>Pay with Phone Number</h2>

        <label for="receiverPhone">Receiver's Phone Number</label>
        <input type="text" id="receiverPhone"
               maxlength="10"
               placeholder="Enter 10-digit phone number">

        <label for="phoneAmount">Amount (₹)</label>
        <input type="number" id="phoneAmount"
               min="0.01" step="0.01"
               placeholder="Enter amount">

        <label for="paymentPassword">Password</label>
        <input type="password" id="paymentPassword"
               placeholder="Enter your password">

        <p id="phoneMessage" class="errorMessage"></p>

        <button type="button" id="payByPhone">Pay</button>

        <button type="button"
                onclick="location.href='homepage.html'">
            Back
        </button>
    </div>
</body>
</html>
