<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Secure UPI Payment Simulator</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="styles.css">

    <!-- Connect JavaScript file -->
    <script src="login.js" defer></script>
</head>

<body class="login-body">

    <div id="login">

        <h2 style="text-align: center;">Secure UPI Login</h2>

        <form id="loginForm">

            <!-- Username -->
            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required
            >

            <p id="nameValid" class="errorMessage"></p>

            <!-- Password -->
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <p id="passwordValid" class="errorMessage"></p>

            <!-- Login button -->
            <button type="submit">Login</button>

        </form>

    </div>

</body>
</html>
