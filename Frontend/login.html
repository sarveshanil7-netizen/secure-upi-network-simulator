<html>
    <head>
        <title>Login Page</title>
        <link rel="stylesheet" href="styles.css">
        <script src="login.js" defer></script>
    </head>
    <body class="login-body">
        <div id="login">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username">
            <p class="errorMessage" id="nameValid"></p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" style="margin-top:0"><br>
            <p class="errorMessage" id="passwordValid"></p>
            <a href="homepage.html"><button type="button" id="login-btn">Login</button></a>
        </div>
    </body>
</html>
