<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Secure UPI Payment Simulator</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="styles.css">

    <!-- Connect JavaScript file -->
    <script src="login.js" defer></script>
</head>

<body class="login-body">

    <div id="login">

        <h2 style="text-align: center;">Secure UPI Login</h2>
        <p style="text-align: center; color: #555; font-size: 13px; margin-top: -10px;">
            Database Authentication Enabled
        </p>

        <form id="loginForm">

            <!-- Username -->
            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your registered username"
                required
            >

            <p id="nameValid" class="errorMessage"></p>

            <!-- Password -->
            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <p id="passwordValid" class="errorMessage"></p>

            <!-- Login button -->
            <button type="submit" id="loginBtn">Login</button>

            <!-- Register link -->
            <p style="text-align: center; margin-top: 18px; font-size: 15px;">
                New user? 
                <a href="register.html" style="color: #176bba; font-weight: bold; text-decoration: underline;">
                    Register here &rarr;
                </a>
            </p>

        </form>

    </div>

</body>
</html>
